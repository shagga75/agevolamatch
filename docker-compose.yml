services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - agevolamatch-data:/app/data
    env_file:
      - .env
    environment:
      - AGEVOLAMATCH_DB_PATH=data/agevolamatch.db

  ingest:
    build: .
    volumes:
      - agevolamatch-data:/app/data
      # Mount your own subscriptions file (see examples/alert_subscriptions.yaml).
      - ./examples/alert_subscriptions.yaml:/app/config/alert_subscriptions.yaml:ro
    env_file:
      - .env
    environment:
      - AGEVOLAMATCH_DB_PATH=data/agevolamatch.db
      - ALERT_SUBSCRIPTIONS_PATH=config/alert_subscriptions.yaml
      - INGEST_INTERVAL_SECONDS=86400
      # Flip to "true" only once your .env has real SMTP/Telegram credentials.
      - ALERTS_DRY_RUN=true
      # Flip to "true" to also ingest ANAC/TED tenders and run gare alerts each cycle.
      - ENABLE_GARE=false
    entrypoint: ["./scripts/ingest_loop.sh"]

  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - agevolamatch-data:/app/data
    env_file:
      - .env
    environment:
      - AGEVOLAMATCH_DB_PATH=data/agevolamatch.db
    command:
      [
        "uv",
        "run",
        "streamlit",
        "run",
        "src/agevolamatch/dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]

volumes:
  agevolamatch-data:
